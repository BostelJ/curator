name: Release

# Push a tag like v0.2.0 to build Curator for Apple Silicon and Intel and publish it as a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}" scripts/build.sh --universal
          lipo -archs dist/Curator.app/Contents/MacOS/Curator
          ditto -c -k --keepParent dist/Curator.app "dist/Curator-${GITHUB_REF_NAME}.zip"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/Curator-${GITHUB_REF_NAME}.zip" \
            --title "Curator ${GITHUB_REF_NAME}" --generate-notes
