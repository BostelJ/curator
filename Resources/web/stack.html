<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="photo.css">
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<style>
  #root { position: fixed; right: 0; bottom: 0; padding: 30px 22px 22px 34px; }
  #root:empty { padding: 0; width: 0; height: 0; }

  .pile { position: relative; width: 300px; }
  .pile.big { width: 640px; }

  /* Prints behind the top one peek out above it. */
  .behind { position: absolute; left: 0; right: 0; height: 60px; background: var(--paper); box-shadow: var(--lift); transform-origin: bottom center; }

  .card { position: relative; animation: slidein .3s cubic-bezier(.2,.9,.25,1.05); }
  @keyframes slidein { from { transform: translateX(120%) rotate(3deg); } to { transform: none; } }
  .toss { position: absolute; top: 5px; right: 5px; width: 20px; height: 20px; padding: 0; border: 0; background: transparent; color: var(--muted); font: 500 17px/20px -apple-system, system-ui, sans-serif; opacity: 0; z-index: 4; }
  .card:hover .toss { opacity: 1; }
  .toss:hover { color: var(--marker); background: transparent; }

  .card .print { padding-bottom: 15px; }
  #main { cursor: zoom-in; }
  .pile.big #main { aspect-ratio: auto; height: 430px; cursor: default; }
  .pile.big #main .shot { object-fit: contain; background-color: #f1efe9; }
  .pile.big #main video.shot { background-color: #111; }
  .viewer { position: absolute; inset: 0; overflow: hidden; background: #d9d5cc; }
  .viewer canvas { display: block; width: 100%; height: 100%; }

  /* Marking up: a red marker over the picture, so a note can point at something. */
  .pencil { position: absolute; top: 7px; left: 7px; z-index: 4; width: 30px; height: 30px; padding: 0; display: grid; place-items: center; border: 1.5px solid var(--black); background: var(--paper); }
  .pencil svg { width: 16px; height: 16px; }
  .pencil.on { background: var(--marker); border-color: var(--marker); color: #fff; }
  #ink { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }
  #ink.drawing { pointer-events: auto; cursor: crosshair; }
  .frozen { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #d9d5cc; }
  .marks { display: flex; gap: 10px; align-items: center; margin-right: auto; font: 600 10px var(--mono); letter-spacing: .04em; color: var(--muted); }
  .marks button { padding: 3px 8px; font-size: 11px; }
  .thumb .dot { position: absolute; left: 3px; top: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--marker); z-index: 2; }

  .thumbs { display: flex; gap: 6px; margin-top: 8px; }
  .thumb { width: 56px; height: 42px; overflow: hidden; opacity: .55; cursor: default; flex: none; position: relative; border: 1.5px solid var(--black); }
  .thumb.on { opacity: 1; outline: 2px solid var(--marker); outline-offset: 1px; }
  .thumb .tag-3d { top: 1px; right: 1px; font-size: 7px; padding: 1px 3px; }

  .project { font: 600 9px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .name { font: 400 21px/1.1 var(--hand); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .prompt { font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.35; }
  .text { padding: 14px 3px 0; }
  .topline { display: flex; justify-content: space-between; gap: 8px; }
  .actions { display: flex; gap: 6px; margin-top: 9px; align-items: center; }
  .actions .grow { flex: 1; }
  .notebox { margin-top: 9px; }
  .notebox .actions { justify-content: flex-end; }

  /* F: the card up close, over the whole screen. */
  #root.full { inset: 0; padding: 0; display: grid; place-items: center; background: rgba(17,16,16,.94); }
  .pile.full { width: min(calc(100vw - 160px), calc((100vh - 80px) * 1.45)); height: calc(100vh - 80px); }
  .pile.full .behind { display: none; }
  .pile.full .card, .pile.full .print { height: 100%; }
  .pile.full .print { display: flex; flex-direction: column; }
  .pile.full #main { flex: 1; min-height: 0; height: auto; }
  .pile.full .name { font-size: 30px; }
  .pile.full .thumb { width: 84px; height: 63px; }
  .fullhint { position: fixed; left: 0; right: 0; bottom: 12px; text-align: center; font: 600 13px var(--mono); letter-spacing: .06em; color: rgba(251,250,246,.5); pointer-events: none; }
  .fullhint kbd { margin: 0 2px 0 0; opacity: .9; }

  .slip { padding: 14px 15px 13px; background: var(--paper); box-shadow: var(--lift); border: 2px solid var(--black); }
  .slip .rule { font: 400 22px/1.2 var(--hand); margin: 7px 0 6px; }
  .slip .why { font-size: 12px; line-height: 1.35; color: var(--muted); }
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
import { api, state, media, frameHTML, fillModels, reportSize, native, esc, runClips, clipBarHTML, paperHTML, stillOf } from './common.js';

const root = document.getElementById('root');
const sendSize = reportSize(root);

let cards = [];
let topId = null, big = false, noteOpen = false, shown = 0, busy = false;
let stopViewer = null;
// Marks, per image of the current card: strokes as points in 0..1 of the picture area,
// and for a 3D model or a clip, the frozen view they were drawn on (and for a clip, its moment).
let drawing = false, marks = new Map(), frozen = new Map(), frozenAt = new Map();
let stopClips = () => {};
let full = false, sentFull = false, bigBeforeFull = false, inkWatch = null;
const PENCIL = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M10.8 2.2l3 3-8.6 8.6-3.7.7.7-3.7z"/><path d="M9.3 3.7l3 3"/></svg>';

function stop3D() { stopViewer?.(); stopViewer = null; stopClips(); stopClips = () => {}; }
const noun = (frames, n) => (frames.every((f) => f.kind === 'video') ? 'clip' : 'image') + (n === 1 ? '' : 's');

function behindHTML(n) {
  const peek = Math.min(n, 3);
  let html = '';
  for (let i = peek; i >= 1; i--) {
    const angle = (i % 2 ? 1 : -1) * (0.8 + i * 0.3);
    html += `<div class="behind" style="top:${-i * 8}px; left:${i * 3}px; right:${i * 3}px; transform:rotate(${angle}deg)"></div>`;
  }
  return html;
}

function slipHTML(rule) {
  return `<div class="card slip" id="card">
    <div class="project">${esc(rule.project)} · proposed taste rule</div>
    <div class="rule">${esc(rule.text)}</div>
    ${rule.why ? `<div class="why">${esc(rule.why)}</div>` : ''}
    <div class="actions"><span class="grow"></span><button id="decline">Not quite</button><button class="primary" id="accept">Yes, that's my taste</button></div>
  </div>`;
}

function printHTML(item) {
  const frame = item.frames[shown] || item.frames[0];
  const thumbs = big && item.frames.length > 1
    ? `<div class="thumbs">${item.frames.map((f, i) => `<div class="thumb ${i === shown ? 'on' : ''}" data-i="${i}">${marks.get(i)?.length ? '<span class="dot"></span>' : ''}${frameHTML(f)}</div>`).join('')}</div>` : '';
  const main = big && frozen.has(shown)
    ? `<img class="frozen" src="${frozen.get(shown)}" alt="">`
    : big && frame.kind === 'model'
    ? `<div class="viewer" id="viewer"></div>`
    : frameHTML(frame, { eager: true, play: big ? 'sync' : 'loop' });
  const clipBar = big && frame.kind === 'video' && !frozen.has(shown) ? clipBarHTML() : '';
  const ink = big ? `<button class="pencil ${drawing ? 'on' : ''}" id="pencil" title="Draw on it">${PENCIL}</button><canvas id="ink" class="${drawing ? 'drawing' : ''}"></canvas>` : '';
  return `<div class="card" id="card"><div class="print" id="sheet">
      <button class="toss" id="toss" title="Delete this card">×</button>
      <div class="photo" id="main">${main}${ink}</div>
      ${clipBar}
      ${thumbs}
      <div class="text">
        <div class="topline"><span class="project">${esc(item.project)}</span><span class="num">${item.pass ? `Pass ${item.pass}` : ''}${item.frames.length > 1 ? ` · ${big ? `${noun(item.frames, 1)} ${shown + 1} of ${item.frames.length}` : `${item.frames.length} ${noun(item.frames, 2)}`}` : ''}${big && frozenAt.has(shown) ? ` · at ${frozenAt.get(shown).toFixed(2)}s` : ''}</span></div>
        <div class="name">${esc(item.title)}</div>
        ${item.prompt ? `<div class="prompt">${esc(item.prompt)}</div>` : ''}
        ${item.replacesTitles ? `<div class="prompt">Keeping this replaces ${item.replacesTitles.map((t) => `“${esc(t)}”`).join(', ')} on the wall.</div>` : ''}
        ${noteOpen ? `<div class="notebox">
            <textarea id="note" placeholder="${drawing || markCount() ? 'Circle it on the picture, then say what to change…' : 'Any changes? Goes to the agent word for word…'}">${esc(draft)}</textarea>
            <div class="actions">${markCount() ? `<span class="marks">${markCount()} mark${markCount() > 1 ? 's' : ''}<button id="undoMark">Undo</button><button id="clearMarks">Clear</button></span>` : ''}<button id="cancel">Cancel</button><button class="primary" id="send">Send note</button></div>
          </div>` : `<div class="actions">
            <button class="primary" id="keep">Keep<kbd>⌃⌥K</kbd></button>
            <button id="noteBtn">Note<kbd>${big ? 'N' : '⌃⌥N'}</kbd></button>
            <span class="grow"></span>
            ${full ? '<button id="shrink">Back<kbd>esc</kbd></button>' : big ? '<button id="shrink">Smaller<kbd>esc</kbd></button>' : ''}
            ${cards.length > 1 ? `<span class="num">${cards.length - 1} more waiting</span>` : ''}
          </div>`}
      </div>
    </div></div>`;
}

function tellNative() {
  const film = cards[0]?.kind === 'film';
  let keys = [];
  if (film && !noteOpen) {
    keys = ['keep', 'noteAny', 'deleteAny', 'fullAny'];
    // Plain keys are only taken while you're looking at an enlarged card, so they can't catch your typing.
    if (big || full) keys.push('noteBare', 'deleteBare', 'escape', 'fullBare');
    if (full && cards[0].data.frames.length > 1) keys.push('left', 'right');
  }
  native({ type: 'keys', keys });
}

// Tell the panel to cover the screen, or to go back to its corner, once the page matches.
function syncFull() {
  const want = full && cards[0]?.kind === 'film';
  root.classList.toggle('full', want);
  if (want === sentFull) return;
  sentFull = want;
  if (!want) sendSize();
  native({ type: 'full', on: want });
}

function setFull(on) {
  if (cards[0]?.kind !== 'film') on = false;
  if (on === full) return;
  full = on;
  if (on) { bigBeforeFull = big; big = true; } else big = bigBeforeFull;
  render();
}
window.curatorExitFull = () => setFull(false);

function render() {
  draw();
  syncFull();
}

function draw() {
  tellNative();
  stop3D();
  const top = cards[0];
  if (!top) { root.innerHTML = ''; return; }
  const isRule = top.kind === 'rule';
  root.innerHTML = `<div class="pile ${big && !isRule ? 'big' : ''} ${full && !isRule ? 'full' : ''}">${behindHTML(cards.length - 1)}${isRule ? slipHTML(top.data) : printHTML(top.data)}</div>${full && !isRule
    ? `<div class="fullhint">${top.data.frames.length > 1 ? '<kbd>← →</kbd> images · ' : ''}<kbd>⌃⌥K</kbd> keep · <kbd>N</kbd> note · <kbd>F</kbd> or <kbd>esc</kbd> back</div>` : ''}`;
  root.onclick = (e) => { if (full && e.target === root) setFull(false); };
  if (isRule) {
    document.getElementById('accept').onclick = () => answerRule(true);
    document.getElementById('decline').onclick = () => answerRule(false);
    return;
  }
  const item = top.data;
  fillModels(root);
  document.getElementById('main').onclick = () => { if (!big) { big = true; render(); } };
  root.querySelectorAll('.thumb').forEach((t) => { t.onclick = () => { shown = Number(t.dataset.i); render(); }; });
  const frame = item.frames[shown] || item.frames[0];
  if (big) setUpInk(frame);
  if (big && frame.kind === 'video') stopClips = runClips(document.getElementById('sheet'), `${item.id}:${shown}`);
  if (big && frame.kind === 'model' && !frozen.has(shown)) {
    import('./viewer.js').then(async ({ mount }) => {
      const holder = document.getElementById('viewer');
      if (holder) stopViewer = await mount(holder, media(frame.file));
    }).catch(console.error);
  }
  document.getElementById('shrink')?.addEventListener('click', () => { if (full) setFull(false); else { big = false; render(); } });
  document.getElementById('toss').onclick = (e) => { e.stopPropagation(); remove(); };
  if (noteOpen) {
    const box = document.getElementById('note');
    box.focus();
    box.onkeydown = (e) => {
      if (e.key === 'Escape') closeNote();
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendNote(box.value); }
    };
    box.oninput = () => { draft = box.value; };
    document.getElementById('cancel').onclick = closeNote;
    document.getElementById('send').onclick = () => sendNote(box.value);
    document.getElementById('undoMark')?.addEventListener('click', () => { marks.get(shown)?.pop() || [...marks.values()].reverse().find((m) => m.length)?.pop(); render(); });
    document.getElementById('clearMarks')?.addEventListener('click', () => { marks = new Map(); render(); });
  } else {
    document.getElementById('keep').onclick = keep;
    document.getElementById('noteBtn').onclick = openNote;
  }
}

let draft = '';
const markCount = () => [...marks.values()].reduce((n, m) => n + m.length, 0);

function setUpInk(frame) {
  const canvas = document.getElementById('ink');
  const area = document.getElementById('main');
  if (!canvas) return;
  const ratio = devicePixelRatio || 2;
  const size = () => {
    canvas.width = area.clientWidth * ratio;
    canvas.height = area.clientHeight * ratio;
    paint(canvas, marks.get(shown) || [], canvas.width, canvas.height);
  };
  size();
  // The picture area changes size when the panel goes full screen; keep the marks on it.
  inkWatch?.disconnect();
  inkWatch = new ResizeObserver(size);
  inkWatch.observe(area);
  document.getElementById('pencil').onclick = (e) => { e.stopPropagation(); toggleDrawing(frame); };
  let stroke = null;
  const at = (e) => { const b = canvas.getBoundingClientRect(); return [(e.clientX - b.left) / b.width, (e.clientY - b.top) / b.height]; };
  canvas.onpointerdown = (e) => {
    if (!drawing) return;
    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    stroke = [at(e)];
    if (!marks.has(shown)) marks.set(shown, []);
    marks.get(shown).push(stroke);
  };
  canvas.onpointermove = (e) => {
    if (!stroke) return;
    stroke.push(at(e));
    paint(canvas, marks.get(shown), canvas.width, canvas.height);
  };
  const end = () => { if (stroke) { stroke = null; render(); } };
  canvas.onpointerup = end;
  canvas.onpointercancel = end;
}

// A marker line: thick, round, a little translucent where it crosses itself, like the real thing.
function paint(canvas, strokes, w, h, clear = true) {
  const g = canvas.getContext('2d');
  if (clear) g.clearRect(0, 0, w, h);
  g.strokeStyle = 'rgba(229,57,31,.92)';
  g.lineWidth = Math.max(4, Math.round(Math.min(w, h) * .012));
  g.lineCap = 'round';
  g.lineJoin = 'round';
  for (const s of strokes) {
    g.beginPath();
    g.moveTo(s[0][0] * w, s[0][1] * h);
    if (s.length === 1) g.lineTo(s[0][0] * w + .1, s[0][1] * h);
    for (let i = 1; i < s.length - 1; i++) {
      const mx = (s[i][0] + s[i + 1][0]) / 2, my = (s[i][1] + s[i + 1][1]) / 2;
      g.quadraticCurveTo(s[i][0] * w, s[i][1] * h, mx * w, my * h);
    }
    if (s.length > 1) g.lineTo(s[s.length - 1][0] * w, s[s.length - 1][1] * h);
    g.stroke();
  }
}

// Drawing on a 3D model or a clip freezes the view you're looking at, so the marks stay on what you circled.
function toggleDrawing(frame) {
  drawing = !drawing;
  if (drawing && frame.kind === 'model' && !frozen.has(shown)) {
    const live = document.querySelector('#viewer canvas');
    if (live) frozen.set(shown, live.toDataURL('image/png'));
  }
  if (drawing && frame.kind === 'video' && !frozen.has(shown)) {
    const live = document.querySelector('#main video');
    if (live && live.readyState >= 2) {
      live.pause();
      frozen.set(shown, stillOf(live));
      frozenAt.set(shown, live.currentTime);
    }
  }
  if (drawing && !noteOpen) return openNote();
  render();
}

// The picture as you saw it, with your marks on top, at double size.
async function composite(index) {
  const item = cards[0].data;
  const frame = item.frames[index];
  const area = document.getElementById('main');
  const w = (area?.clientWidth || 600) * 2, h = (area?.clientHeight || 430) * 2;
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const g = canvas.getContext('2d');
  g.fillStyle = frame.kind === 'model' ? '#d9d5cc' : frame.kind === 'video' ? '#111' : '#f1efe9';
  g.fillRect(0, 0, w, h);
  const source = frozen.get(index)
    || (frame.kind === 'model' ? (await import('./viewer.js').then((v) => v.thumbnail(media(frame.file))))
    : frame.kind === 'video' ? await firstFrame(media(frame.file))
    : media(frame.file));
  const img = new Image();
  img.src = source;
  await img.decode();
  const scale = Math.min(w / img.naturalWidth, h / img.naturalHeight);
  const dw = img.naturalWidth * scale, dh = img.naturalHeight * scale;
  g.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);
  paint(canvas, marks.get(index), w, h, false);
  return canvas.toDataURL('image/png');
}

// A clip's opening frame, for marks made before it was frozen (which shouldn't happen, but just in case).
function firstFrame(url) {
  return new Promise((resolve, reject) => {
    const v = document.createElement('video');
    v.muted = true;
    v.preload = 'auto';
    v.onloadeddata = () => { try { resolve(stillOf(v)); } catch (e) { reject(e); } };
    v.onerror = () => reject(new Error('clip did not load'));
    v.src = url;
  });
}

function openNote() {
  if (cards[0]?.kind !== 'film') return;
  noteOpen = true;
  native({ type: 'typing', on: true });
  render();
  setTimeout(() => document.getElementById('note')?.focus(), 30);
}

function closeNote() {
  noteOpen = false;
  drawing = false;
  native({ type: 'typing', on: false });
  render();
}

// The card leaves the way a tossed print does: down through the air.
// `confirm` puts up a slip saying what was sent, so a note never goes off without a sign it arrived.
async function leave(send, confirm = null) {
  if (busy) return;
  busy = true;
  const card = document.getElementById('card');
  if (card) {
    const box = card.getBoundingClientRect();
    const paper = document.getElementById('sheet') || card;
    native({ type: 'leaf', html: paperHTML(paper), x: box.x, y: box.y, w: box.width, direction: -1 });
  }
  root.innerHTML = '';
  if (noteOpen) { noteOpen = false; native({ type: 'typing', on: false }); }
  let failed = null;
  try {
    await send();
  } catch (error) {
    console.error(error);
    failed = String(error?.message || error);
  }
  if (confirm) {
    root.innerHTML = failed
      ? `<div class="sent failed">Couldn't send the note: ${esc(failed)}<br>Your words: “${esc(confirm.words || '')}”</div>`
      : `<div class="sent"><span class="tick">✓</span>${esc(confirm.text)}</div>`;
    await new Promise((done) => setTimeout(done, failed ? 6000 : 1500));
  }
  busy = false;
  topId = null; big = full; shown = 0;
  resetMarks();
  refresh();
}

function keep() {
  const top = cards[0];
  if (top?.kind !== 'film') return;
  leave(() => api('/api/answer', { id: top.data.id, action: 'keep' }));
}

async function sendNote(note) {
  const top = cards[0];
  if ((!note.trim() && !markCount()) || top?.kind !== 'film' || busy) return;
  const files = [];
  for (const [index, strokes] of marks) {
    if (!strokes.length) continue;
    try {
      const png = await composite(index);
      const saved = await api('/api/markup', { id: top.data.id, frameId: top.data.frames[index].id, png, time: frozenAt.get(index) });
      files.push(saved.file);
    } catch (error) {
      console.error(error);
    }
  }
  const text = note.trim() || 'See my marks.';
  leave(() => api('/api/answer', { id: top.data.id, action: 'note', note: text, markups: files }),
    { text: 'Note sent to the agent', words: text });
}

function remove() {
  const top = cards[0];
  if (top?.kind !== 'film') return;
  leave(() => api('/api/answer', { id: top.data.id, action: 'delete' }));
}

function answerRule(accept) {
  const top = cards[0];
  if (top?.kind !== 'rule') return;
  leave(() => api('/api/rule/answer', { id: top.data.id, accept }));
}

function resetMarks() { drawing = false; marks = new Map(); frozen = new Map(); frozenAt = new Map(); draft = ''; }

window.curatorKey = (key) => {
  if (key === 'keep') keep();
  if (key === 'noteAny' || key === 'noteBare') { big = true; openNote(); }
  if (key === 'deleteAny' || key === 'deleteBare') remove();
  if (key === 'escape') {
    drawing = false;
    if (full) setFull(false); else { big = false; render(); }
  }
  if (key === 'fullAny' || key === 'fullBare') setFull(!full);
  if ((key === 'left' || key === 'right') && full && cards[0]?.kind === 'film') {
    const n = cards[0].data.frames.length;
    shown = (shown + (key === 'left' ? n - 1 : 1)) % n;
    render();
  }
};

let lastCount = 0;
async function refresh() {
  if (busy) return;
  const s = await state();
  cards = [
    ...s.refine.map((data) => ({ kind: 'film', id: data.id, at: data.createdAt, data })),
    ...s.proposedRules.map((data) => ({ kind: 'rule', id: data.id, at: data.createdAt, data })),
  ].sort((a, b) => a.at - b.at);
  const nextTop = cards[0]?.id ?? null;
  if (nextTop !== topId) {
    topId = nextTop;
    // Full screen carries on to the next card, so a run of passes can be reviewed up close.
    if (cards[0]?.kind !== 'film') full = false;
    big = full; shown = 0;
    resetMarks();
    if (noteOpen) { noteOpen = false; native({ type: 'typing', on: false }); }
    render();
  } else if (!noteOpen && cards.length !== lastCount) {
    render();
  }
  if (!cards.length) tellNative();
  lastCount = cards.length;
}

window.curatorRefresh = refresh;
refresh();
</script>
</body>
</html>
