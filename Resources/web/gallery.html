<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Art Gallery</title>
<link rel="stylesheet" href="photo.css">
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<style>
  :root { --wall: #f6f4ee; --line: rgba(27,25,23,.14); }
  html, body { height: 100%; background: var(--wall); color: var(--ink); overflow: hidden; }
  main { height: 100vh; overflow-y: auto; padding: 18px 56px 70px; }

  /* The project names sit quietly along the top, clear of the window's traffic lights. */
  .top { display: flex; align-items: baseline; gap: 20px; padding-left: 62px; min-height: 26px; }
  .top button { background: none; border: 0; padding: 0; font: 600 11px var(--mono); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
  .top button:hover { background: none; color: var(--ink); }
  .top button.on { color: var(--ink); text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 1.5px; }
  .top .count { margin-left: auto; font: 600 11px var(--mono); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }

  .hero { display: grid; grid-template-columns: minmax(0, 11fr) minmax(0, 9fr); gap: 40px; margin-top: 44px; min-height: 560px; }
  .kicker { font: 600 12px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .words { margin-top: 24px; }
  .rule { position: relative; font-family: var(--serif); font-weight: 400; line-height: 1.05; letter-spacing: -.025em; margin-bottom: .16em; }
  .rule .why { display: block; height: 0; overflow: hidden; opacity: 0; font: 13px/1.4 -apple-system, system-ui, sans-serif; letter-spacing: 0; color: var(--muted); transition: opacity .15s; }
  .rule:hover .why { height: auto; opacity: 1; margin: 7px 0 13px; }
  .rule .why button { margin-left: 8px; background: none; border: 0; padding: 0; font-size: 12px; color: var(--muted); text-decoration: underline; }
  .rule .why button:hover { color: var(--marker); background: none; }
  .nothing { font: 400 44px/1.1 var(--serif); letter-spacing: -.02em; color: var(--muted); }
  .quote { font: 400 25px/1.28 var(--hand); color: #3a332b; margin-top: 34px; max-width: 34em; }

  .cluster { position: relative; }
  .cluster .held { position: absolute; }

  .held { cursor: zoom-in; transition: transform .16s cubic-bezier(.2,.9,.25,1.1); }
  .held:hover { transform: rotate(0deg) scale(1.025) !important; z-index: 8 !important; }
  .held .print { padding: 4.6%; padding-bottom: 0; }
  .held .caption { min-height: 0; padding: 4% 1px 5%; gap: 8px; }
  .held .label { font-size: clamp(14px, 1.45vw, 21px); }

  .wall { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 44px 42px; align-items: start; margin-top: 56px; }

  .empty { max-width: 460px; margin: 22vh auto; text-align: center; color: var(--muted); line-height: 1.5; }
  .empty h3 { font: 400 28px var(--serif); color: var(--ink); margin: 0 0 8px; }

  .shelf { margin-top: 60px; padding-top: 18px; border-top: 1px solid var(--line); }
  .shelf summary { font: 600 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); cursor: default; list-style: none; }
  .shelf summary::before { content: "▸ "; }
  .shelf[open] summary::before { content: "▾ "; }
  .shelf-row { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 16px; }
  .gone { width: 150px; }
  .gone .photo { filter: saturate(.35); opacity: .8; }
  .gone:hover .photo { filter: none; opacity: 1; }
  .gone .t { font-size: 12.5px; font-weight: 600; margin-top: 6px; }
  .gone .why { font-size: 11.5px; line-height: 1.3; color: var(--muted); margin-top: 2px; }
  .gone button { margin-top: 6px; font-size: 11px; padding: 2px 7px; }

  /* Open a print to see the road behind it. */
  #light { position: fixed; inset: 0; z-index: 10; background: rgba(17,16,16,.975); color: var(--paper); display: none; grid-template-rows: auto minmax(0, 1fr) auto; padding: 16px 40px 22px; gap: 14px; }
  #light.on { display: grid; }
  .l-top { display: flex; align-items: baseline; gap: 14px; padding-left: 50px; }
  .l-title { font: 400 25px var(--hand); }
  .l-sub { font: 600 10px var(--mono); letter-spacing: .08em; text-transform: uppercase; opacity: .6; }
  .l-top .grow { flex: 1; }
  #light button { color: var(--paper); background: transparent; border-color: rgba(251,250,246,.55); }
  #light button:hover { background: rgba(251,250,246,.14); }
  #light button.take:hover { color: var(--marker); border-color: var(--marker); }
  .l-main { position: relative; min-height: 0; display: grid; place-items: center; }
  .l-main img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .l-main .view3d { position: absolute; inset: 0; overflow: hidden; }
  .l-main canvas { display: block; width: 100%; height: 100%; }
  .l-road { display: flex; align-items: flex-end; gap: 10px; overflow-x: auto; padding: 3px; }
  .l-road .step { flex: none; width: 96px; cursor: default; opacity: .55; }
  .l-road .step:hover { opacity: .85; }
  .l-road .step.on { opacity: 1; }
  .l-road .step .photo { border-color: rgba(251,250,246,.8); }
  .l-road .step.on .photo { outline: 2px solid var(--paper); outline-offset: 1px; }
  .l-road .step .num { display: block; margin-top: 4px; color: rgba(251,250,246,.65); font-size: 9px; }
  .l-notes { flex: 1; min-width: 200px; padding-left: 18px; font: 400 18px/1.28 var(--hand); max-height: 112px; overflow-y: auto; align-self: stretch; }
  .l-notes div { margin-bottom: 7px; }
</style>
</head>
<body>
<main id="main"></main>
<div id="light"></div>
<script type="module">
import { api, state, media, frameHTML, fillModels, esc } from './common.js';

const main = document.getElementById('main'), light = document.getElementById('light');
let current = localStorage.getItem('project');
let data = null, stopViewer = null, shelfOpen = false, openStrip = null, openFrame = 0;

const when = (t) => new Date(t * 1000).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });

// The same print always hangs the same way, so the wall doesn't shuffle when it refreshes.
function hash(text) {
  let h = 2166136261;
  for (const c of text) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
const tilt = (id) => ((hash(id) % 90) / 10 - 4.5) || 2;
const finalOf = (s) => s.frames.filter((f) => f.final)[0] || s.frames[s.frames.length - 1];

// How it got here, in words: a tournament, then the real passes. Frames from before this was
// recorded carry no stage, so for those each round counts as a pass.
function roadOf(s) {
  const rounds = [...new Set(s.frames.map((f) => f.round))].sort((a, b) => a - b);
  const picked = s.frames.some((f) => f.stage === 'quick_pick');
  const passes = rounds.filter((r) => s.frames.some((f) => f.round === r && f.stage !== 'quick_pick')).length;
  return { picked, passes, rounds };
}
function roadLabel(s) {
  const { picked, passes } = roadOf(s);
  const p = passes ? `${passes} pass${passes > 1 ? 'es' : ''}` : '';
  return [picked ? 'picked' : '', p].filter(Boolean).join(' + ');
}
// One label per image in the road: the tournament pick, then Pass 1, 2…, and Kept for the final images.
function stepLabels(s) {
  const { rounds } = roadOf(s);
  const passNumber = new Map();
  let n = 0;
  for (const r of rounds) if (s.frames.some((f) => f.round === r && f.stage !== 'quick_pick')) passNumber.set(r, ++n);
  return s.frames.map((f) => f.stage === 'quick_pick' ? 'Picked' : `Pass ${passNumber.get(f.round)}${f.final ? ' · kept' : ''}`);
}

function printHTML(s, style) {
  const label = roadLabel(s);
  const passes = label && label !== '1 pass' ? `<span class="num">${label}</span>` : '';
  return `<div class="held" data-strip="${s.id}" style="${style};transform:rotate(${tilt(s.id).toFixed(1)}deg)">
    <div class="print"><div class="photo">${frameHTML(finalOf(s))}</div>
    <div class="caption"><span class="label">${esc(s.title)}</span>${passes}</div></div></div>`;
}

// Where the newest prints fall beside the words: left, top, width (all percent of the column's width), stacking.
const SLOTS = [[8, 0, 62, 2], [46, 38, 50, 4], [0, 62, 56, 3], [38, 102, 52, 5]];

function headline(rules) {
  const longest = Math.max(...rules.map((r) => r.text.length));
  const total = rules.reduce((sum, r) => sum + r.text.length, 0);
  const room = Math.max(320, (main.clientWidth - 112) * .52);
  const size = Math.max(30, Math.min(88, room / (longest * .47), Math.sqrt(room * 460 / total) * .86));
  return rules.map((r) => `<div class="rule" style="font-size:${size.toFixed(0)}px">${esc(r.text)}
    <span class="why">${esc(r.why || '')}<button data-rule="${r.id}">Remove</button></span></div>`).join('');
}

function render() {
  const projects = data.projects;
  if (!projects.includes(current)) current = projects[0] ?? null;
  if (!current) {
    main.innerHTML = `<div class="empty"><h3>Nothing here yet</h3>What you Keep hangs here, and the taste rules you accept become the headline. Agents read it before their next pass.</div>`;
    return;
  }
  const strips = data.strips.filter((s) => s.project === current);
  const rules = data.rules.filter((r) => r.project === current);
  const retired = (data.retired || []).filter((s) => s.project === current);
  const notes = strips.flatMap((s) => s.notes).filter((n) => n.length <= 150);
  const quote = notes[notes.length - 1];
  const beside = strips.slice(0, SLOTS.length), rest = strips.slice(SLOTS.length);

  main.innerHTML = `
    <div class="top">
      ${projects.map((p) => `<button class="${p === current ? 'on' : ''}" data-p="${esc(p)}">${esc(p)}</button>`).join('')}
      <span class="count">${strips.length} kept</span>
    </div>
    <section class="hero">
      <div>
        <div class="kicker">What we like</div>
        <div class="words">${rules.length ? headline(rules) : `<div class="nothing">Nothing written down yet.</div>`}</div>
        ${quote ? `<div class="quote">“${esc(quote)}”</div>` : ''}
      </div>
      <div class="cluster" id="cluster">
        ${beside.map((s, i) => printHTML(s, `left:${SLOTS[i][0]}%;top:calc(var(--col) * ${SLOTS[i][1] / 100});width:${SLOTS[i][2]}%;z-index:${SLOTS[i][3]}`)).join('')}
      </div>
    </section>
    ${rest.length ? `<section class="wall">${rest.map((s) => printHTML(s, `width:${78 + hash(s.id) % 23}%;margin-left:${hash(s.id + 'x') % 12}%`)).join('')}</section>` : ''}
    ${retired.length ? `<details class="shelf" ${shelfOpen ? 'open' : ''}><summary>Retired · ${retired.length}</summary><div class="shelf-row">${retired.map((s) =>
      `<div class="gone"><div class="photo">${frameHTML(finalOf(s))}</div><div class="t">${esc(s.title)}</div><div class="why">${esc(s.retiredReason || 'Taken down')}</div><button data-restore="${s.id}">Put back</button></div>`).join('')}</div></details>` : ''}`;

  // The prints are positioned freely, so the column has to be told how tall they end up.
  const cluster = document.getElementById('cluster');
  const col = cluster.clientWidth;
  cluster.style.setProperty('--col', col + 'px');
  const printHeight = (width) => width * .98; // a 4:3 photo, its mat and caption
  const bottom = Math.max(0, ...beside.map((_, i) => SLOTS[i][1] / 100 * col + printHeight(SLOTS[i][2] / 100 * col)));
  cluster.style.height = Math.ceil(bottom + 24) + 'px';

  fillModels(main);
  main.querySelectorAll('[data-p]').forEach((b) => { b.onclick = () => { current = b.dataset.p; localStorage.setItem('project', current); render(); main.scrollTop = 0; }; });
  main.querySelectorAll('.held').forEach((el) => { el.onclick = () => openLight(el.dataset.strip); });
  main.querySelectorAll('[data-rule]').forEach((b) => { b.onclick = () => api('/api/rule/answer', { id: b.dataset.rule, accept: false }); });
  main.querySelectorAll('[data-restore]').forEach((b) => { b.onclick = () => api('/api/strip/restore', { id: b.dataset.restore }); });
  main.querySelector('.shelf')?.addEventListener('toggle', (e) => { shelfOpen = e.target.open; });
}

async function openLight(id) {
  const strip = data.strips.find((s) => s.id === id);
  if (!strip) return closeLight();
  openStrip = id;
  openFrame = Math.max(0, strip.frames.findIndex((f) => f.final));
  drawLight();
}

async function drawLight() {
  stopViewer?.();
  stopViewer = null;
  const strip = data.strips.find((s) => s.id === openStrip);
  if (!strip) return closeLight();
  const frame = strip.frames[openFrame];
  light.innerHTML = `
    <div class="l-top">
      <span class="l-title">${esc(strip.title)}</span>
      <span class="l-sub">Kept ${when(strip.keptAt)}${roadLabel(strip) ? ' · ' + roadLabel(strip) : ''}</span>
      <span class="grow"></span>
      <button class="take" id="take">Take down</button><button id="close">Close<kbd>esc</kbd></button>
    </div>
    <div class="l-main" id="lmain">${frame.kind === 'model' ? '<div class="view3d" id="view3d"></div>' : `<img src="${esc(media(frame.file))}" alt="">`}</div>
    <div class="l-road">
      ${(() => { const labels = stepLabels(strip); return strip.frames.map((f, i) => `<div class="step ${i === openFrame ? 'on' : ''}" data-i="${i}"><div class="photo">${frameHTML(f)}</div><span class="num">${labels[i]}</span></div>`).join(''); })()}
      ${strip.notes.length ? `<div class="l-notes">${strip.notes.map((n) => `<div>“${esc(n)}”</div>`).join('')}</div>` : ''}
    </div>`;
  light.classList.add('on');
  fillModels(light);
  document.getElementById('close').onclick = closeLight;
  document.getElementById('take').onclick = async () => { closeLight(); await api('/api/strip/remove', { id: strip.id }); };
  light.querySelectorAll('.step').forEach((el) => { el.onclick = () => { openFrame = Number(el.dataset.i); drawLight(); }; });
  if (frame.kind === 'model') {
    const { mount } = await import('./viewer.js');
    const holder = document.getElementById('view3d');
    if (holder) stopViewer = await mount(holder, media(frame.file));
  }
}

function closeLight() {
  stopViewer?.();
  stopViewer = null;
  openStrip = null;
  light.classList.remove('on');
  light.innerHTML = '';
}
addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLight(); });
let sizeTimer;
addEventListener('resize', () => { clearTimeout(sizeTimer); sizeTimer = setTimeout(() => data && render(), 120); });

async function refresh() {
  data = await state();
  const scroll = main.scrollTop;
  render();
  main.scrollTop = scroll;
}
window.curatorRefresh = refresh;
refresh();
</script>
</body>
</html>
